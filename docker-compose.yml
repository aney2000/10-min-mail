# 10 Minute Mail -- local stack.
#
#   docker compose up --build     start it
#   docker compose down           stop it, keep the data
#   docker compose down -v        stop it and delete the mailboxes
#
# Then open http://localhost:8000 and send test mail to port 1025.

services:
  app:
    build: .
    image: ten-min-mail:latest
    container_name: ten-min-mail

    ports:
      # host:container
      - "8000:8000"   # web UI and REST API
      - "1025:1025"   # SMTP
      #
      # To use the standard SMTP port, publish "25:1025" instead. The
      # privileged bind then happens in Docker's networking layer and
      # the application still runs unprivileged inside the container --
      # which is the entire reason it listens on 1025.
      #
      # Note that most ISPs block inbound port 25 to residential
      # connections, and mail from the public internet also needs an MX
      # record, a static IP with matching reverse DNS, and SPF/DKIM to
      # avoid being treated as spam. None of that is in scope here.

    environment:
      TMM_HTTP_HOST: "0.0.0.0"
      TMM_HTTP_PORT: "8000"
      TMM_SMTP_HOST: "0.0.0.0"
      TMM_SMTP_PORT: "1025"
      TMM_MAIL_DOMAIN: "localhost.test"
      TMM_DATABASE_PATH: "/data/ten_min_mail.db"
      TMM_SWEEP_INTERVAL: "60"
      TMM_LOG_LEVEL: "INFO"

    volumes:
      # A named volume, not a bind mount: it is managed by Docker,
      # works identically on Windows, macOS and Linux, and avoids the
      # file-permission mismatch a bind mount causes when the container
      # runs as a non-root user whose UID does not exist on the host.
      - mailbox-data:/data

    # Restart on failure but not when deliberately stopped. `always`
    # would resurrect a container you stopped on purpose.
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8000/health", timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  mailbox-data:
