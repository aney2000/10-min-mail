# Continuous integration.
#
# `make check` only helps if you remember to run it, and it runs in a
# virtualenv that has accumulated packages you installed once and never
# declared. CI runs the same gate on a clean machine, which is the only
# honest answer to "does this work for someone who just cloned it?"

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Pushing three times in a minute should not queue three full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell should not hide the others: a failure on 3.13
      # alone tells you it is version-specific.
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11"; claiming a
        # version without running it is a guess.
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        # The project is developed on Windows, where paths, line
        # endings and sockets all differ enough to be worth one real run.
        include:
          - python-version: "3.12"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      # Separate steps, so the Actions UI shows which stage failed
      # without anyone reading the log.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

      # Fails the build on a known CVE in any installed package. One
      # cell only: the dependency tree is the same everywhere, so
      # running it four times just costs time.
      - name: Audit dependencies for known vulnerabilities
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install pip-audit
          pip-audit --skip-editable
